<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var knownRoutes = ['about', 'projects', 'experience', 'volunteering', 'gallery', 'contact'];
        var path = window.location.pathname + window.location.search + window.location.hash;
        var segments = window.location.pathname.split('/').filter(Boolean);
        var firstSegment = segments[0] || '';
        var base = firstSegment && knownRoutes.indexOf(firstSegment) === -1 ? '/' + firstSegment : '';
        var normalized = path.indexOf(base) === 0 ? path.slice(base.length) || '/' : path;

        sessionStorage.setItem('gh-pages-path', normalized);
        window.location.replace((base || '') + '/');
      })();
    </script>
  </head>
  <body></body>
</html>
